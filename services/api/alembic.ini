# Alembic configuration — Migration Foundation (Prompt 9).
#
# See docs/06-engineering-foundation.md, Section 7 (Migration Philosophy)
# and alembic/README.md for the full migration workflow and philosophy.
#
# Deliberately, [alembic] sqlalchemy.url below is left BLANK. The real
# connection string is supplied at runtime by alembic/env.py, which reads
# it from app.core.config.Settings (i.e. from the environment / .env file)
# — exactly the same source of truth the running application itself uses.
# This avoids a second, parallel place a database URL could be configured
# and drift out of sync with services/api/.env.example.

[alembic]
script_location = alembic
prepend_sys_path = .

# Timezone-aware, sortable migration file naming — makes the chronological
# order of migrations obvious from the filename alone as the number of
# domains (and therefore migrations) grows across future prompts.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Intentionally blank — see module comment above.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
datefmt = %%H:%%M:%%S
